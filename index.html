</style></head><body><main id="app"></main><script>
'use strict';
const DB='form-hyrox-trainer-v1',RACE='2027-02-19',BEGIN='2026-10-28';
const physio=[
['Spanish Squat','3 × 20 Sek.','Nur bei guter Verträglichkeit, am besten nach Anleitung durch Physio.','Basis'],
['Lunge Hold mit Zehen auf Erhöhung','2 × 15 Sek./Seite','Einbeinige Beuge: zunächst zurückstellen.','Später'],
['Lunge + Jump','2 × 5/Seite','Sprünge nur nach Freigabe und Belastungsaufbau.','Später'],
['Copenhagen Plank','2 × 15 Sek./Seite','Kurzer Hebel, ruhig halten.','Basis'],
['Poliquin Step Down','2 × 8/Seite','Erst nach Abklärung schmerzarm einbauen.','Später'],
['Sissy Squat','2 × 8','Hohe vordere Kniebelastung: derzeit nicht trainieren.','Später'],
['Alternating Toe Taps Standing (Barbell)','2 × 10','Langsam, mit leichtem Gewicht, sicherer Stand.','Optional'],
['Box Step Down (Tempo)','2 × 8/Seite','Nur mit niedriger Stufe und sauberer Kontrolle.','Später'],
['Tibialis Rotation','2 × 10/Seite','Fuß- und Unterschenkelbewegung kontrolliert, nicht ins Knie verdrehen.','Basis'],
['SL Hamstring Bridge isometrisch','2 × 15 Sek./Seite','Hüfte hoch, Knieposition komfortabel.','Basis'],
['Single Leg Box Jumps','2 × 4/Seite','Einbeinig abspringen, beidbeinig landen, erst nach Return-to-Jump-Freigabe.','Später'],
['Seated Leg Raise','2 × 10/Seite','Sitzend gestrecktes Bein schmerzarm anheben.','Basis'],
['Seated Hip Internal Rotation','2 × 10/Seite','Rolle zwischen Knien; sanfte kontrollierte Rotation.','Basis'],
['Band Resisted Crossover Step','2 × 8/Seite','Widerstandsband leicht, Knie stabil.','Optional'],
['Banded Lunge Heel Tap','2 × 8/Seite','Band zieht nach innen, Rückwärts-Lunge, Ferse tippt vorne: erst später.','Später']
];
const exercises=[
['Radfahren locker','8–30 Min.','Ausdauer'],['SkiErg','400 m','HYROX'],['RowErg','400 m','HYROX'],['Farmers Carry','2 × 30 m','HYROX'],['Sled Push','10–15 m','HYROX'],['Sled Pull','10–15 m','HYROX'],['Wall Balls','20 Wiederholungen','HYROX'],['Burpee Broad Jumps','10 m','HYROX'],['Sandbag Lunges','20 m','HYROX'],['Bankdrücken','3 × 6','Kraft'],['Rumänisches Kreuzheben','3 × 8','Kraft'],['Kabelrudern','3 × 10','Kraft'],['Glute Bridge','2 × 12','Kraft'],['Wadenheben','2 × 15','Kraft'],['Lockeres Laufen/Gehen','Intervall','Ausdauer'],...physio.map(x=>[x[0],x[1],'Physio',x[2],x[3]])
];
const initialPlans=()=>[
{id:'P',name:'Physio & Knie',kind:'Physio',mins:45,items:['Radfahren locker','Spanish Squat','Copenhagen Plank','SL Hamstring Bridge isometrisch','Seated Leg Raise','Seated Hip Internal Rotation','Tibialis Rotation']},
{id:'A',name:'Kraft & Ausdauer',kind:'Kraft',mins:55,items:['Radfahren locker','Rumänisches Kreuzheben','Bankdrücken','Kabelrudern','Glute Bridge']},
{id:'C',name:'HYROX Mixed Doubles',kind:'HYROX',mins:55,items:['SkiErg','RowErg','Farmers Carry','Kabelrudern','Radfahren locker']}
];
const fresh=()=>({v:1,plans:initialPlans(),sessions:[],checkins:[],custom:[],football:'pausiert',activeWeek:1,partner:'',notes:'',levelSettings:{},cleared:false});
let state=fresh(),page='home',selected=null,kind='Alle',search='',saveError=false;
let trainingTab='A',calendarOffset=0,calendarSelected=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const daysUntil=()=>Math.max(0,Math.round((new Date(RACE+'T12:00:00')-new Date(date()+'T12:00:00'))/86400000));
const weeks=()=>Math.max(1,Math.min(16,1+Math.floor((new Date(date()+'T12:00:00')-new Date(BEGIN+'T12:00:00'))/604800000)));
const stage=w=>w<=4?'Knie & Grundlage':w<=8?'Ausdaueraufbau':w<=12?'Mixed Doubles':w<=14?'Rennvorbereitung':'Tapering';
const approved=name=>!['Lunge + Jump','Sissy Squat','Single Leg Box Jumps','Banded Lunge Heel Tap','Poliquin Step Down','Box Step Down (Tempo)','Lunge Hold mit Zehen auf Erhöhung','Burpee Broad Jumps','Sandbag Lunges','Wall Balls','Sled Push'].includes(name);
const catalog=()=>[...exercises,...state.custom.map(x=>[x,'Individuell','Eigene Übung'])];
const detail=name=>catalog().find(x=>x[0]===name)||[name,'3 × 8','Individuell'];
function read(){try{let raw=localStorage.getItem(DB);if(raw){let d=JSON.parse(raw);if(d&&Array.isArray(d.plans)&&Array.isArray(d.sessions)&&Array.isArray(d.checkins)){state={...fresh(),...d}}}}catch(e){saveError=true}}
function save(){try{localStorage.setItem(DB,JSON.stringify(state));saveError=false}catch(e){saveError=true}renderStatus()}
function renderStatus(){let e=$('#save-status');if(e)e.textContent=saveError?'Speicherfehler · Bitte JSON sichern':'Lokal gespeichert'}
function sessions(){return state.sessions.filter(x=>x.status==='done')}
function points(){let x=sessions().reduce((a,s)=>a+(s.type==='Physio'?45:75),0);return x}
function level(){return Math.floor(points()/300)+1}
function achievement(){let s=sessions(),p=s.filter(x=>x.type==='Physio').length,h=s.filter(x=>x.type==='HYROX').length;return [{label:'Erster Schritt',ok:s.length>=1,desc:'Ein erstes Workout abschließen'},{label:'Knie-Routine',ok:p>=4,desc:'Vier Physio-Einheiten'},{label:'HYROX Starter',ok:h>=3,desc:'Drei Doubles-Einheiten'},{label:'Dranbleiber',ok:s.length>=12,desc:'Zwölf absolvierte Workouts'}]}

function iconSvg(name){const paths={
home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
training:'<path d="M2 10v4m4-7v10m12-10v10m4-7v4M6 12h12"/>',
calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>',
physio:'<path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/>',
progress:'<path d="M3 20V4m0 16h18M7 16l5-5 3 3 5-8"/>',
settings:'<path d="M12 3v2m0 14v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M3 12h2m14 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><circle cx="12" cy="12" r="4"/>'
};return '<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[name]||paths.home)+'</svg>'}
function prettyDate(s){return new Date(s+'T12:00:00').toLocaleDateString('de-AT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function exSymbol(name){const n=name.toLowerCase();return n.includes('ski')?'S':n.includes('row')?'R':n.includes('squat')?'SQ':n.includes('plank')?'PL':n.includes('bridge')?'BR':n.includes('sled')?'SL':n.includes('carry')?'FC':n.includes('lunge')?'LG':n.includes('ball')?'WB':n.includes('bank')?'BP':n.includes('kreuz')?'DL':n.includes('rad')?'BI':'✦'}
function dayPlan(d){const w=d.getDay(),s=state.football;if(s==='Sonntag'){if(w===2)return'A';if(w===3)return'P';if(w===5)return'C';if(w===0)return'F'}else{if(w===1)return'A';if(w===2)return'P';if(w===6)return'C';if(s==='Donnerstag'&&w===4)return'F'}return''}
function selectedSession(id){return state.plans.find(x=>x.id===id)||state.plans[0]}
function trainingRow(name){return '<div class="exercise-row"><div class="exercise-thumb">'+esc(exSymbol(name))+'</div><div class="exercise-desc"><strong>'+esc(name)+'</strong><small>'+esc(detail(name)[1])+'</small></div><span class="chevron">›</span></div>'}

function nav(){return '<nav class="nav" aria-label="Hauptnavigation">'+[['home','Heute'],['training','Training'],['calendar','Kalender'],['physio','Physio'],['progress','Fortschritt']].map(x=>'<button aria-label="'+x[1]+'" aria-current="'+(page===x[0]?'page':'false')+'" class="'+(page===x[0]?'active':'')+'" data-nav="'+x[0]+'"><b>'+iconSvg(x[0])+'</b>'+x[1]+'</button>').join('')+'</nav>'}
function renderAppHeader(){return '<header class="top"><div><div class="logo">HYROX<span>.</span></div><div class="brand-sub">TRAINING · PROGRESS · YOU</div></div><div class="top-right"><span class="meta" id="save-status"></span><button class="top-icon" data-nav="settings" title="Einstellungen" aria-label="Einstellungen">'+iconSvg('settings')+'</button></div></header>'}
function home(){let w=weeks(),s=sessions(),p=points(),plans=state.plans,main=selectedSession('A');return '<div class="page-heading"><div><p class="eyebrow">DEIN TRAININGSDASHBOARD</p><h1>Heute</h1><div class="muted">'+esc(prettyDate(date()))+'</div></div><span class="tag">Woche '+w+'/16</span></div>'+
'<div class="workout-hero"><div class="row"><div><span class="tag">DEIN NÄCHSTER STEP</span><h2>'+esc(main.name)+'</h2><p>Stärker werden. Knie kontrolliert belasten.</p></div><button class="play-round" data-start="A" aria-label="Krafttraining starten">▶</button></div><div class="workout-minis"><span>◈ <b>'+main.items.length+' Übungen</b></span><span>◷ <b>ca. '+main.mins+' Min.</b></span><span>◎ <b>Mixed Doubles</b></span></div><div class="progress"><div style="width:'+(Math.min(100,s.length/48*100))+'%"></div></div><div class="muted" style="margin-top:8px">'+s.length+' Einheiten absolviert</div></div>'+
'<div class="section-title"><h2>Nächste Einheiten</h2><button class="btn outline" data-nav="calendar">Kalender</button></div>'+
plans.filter(x=>x.id!=='A').map(x=>'<div class="card plan-card"><div class="row"><div><span class="tag">'+esc(x.kind)+'</span><h3 style="margin:9px 0 4px">'+esc(x.name)+'</h3><div class="muted">'+x.items.length+' Übungen · '+x.mins+' Minuten</div></div><button class="play-round small" data-start="'+x.id+'" aria-label="'+esc(x.name)+' starten">▶</button></div></div>').join('')+
'<div class="metrics"><div class="card metric"><small>Workouts</small><b>'+s.length+'</b><small>erledigt</small></div><div class="card metric"><small>Aktuelles Level</small><b>'+level()+'</b><small>'+p+' XP</small></div><div class="card metric"><small>Wettkampf in</small><b>'+daysUntil()+'</b><small>Tagen</small></div></div>'+
'<div class="section-title"><h2>Dein Fortschritt</h2><button class="btn outline" data-nav="progress">Ansehen</button></div><div class="card"><div class="row"><h3>LEVEL '+level()+'</h3><span class="tag">'+(p%300)+'/300 XP</span></div><div class="progress"><div style="width:'+(p%300/3)+'%"></div></div><p class="muted" style="margin:11px 0 0">Wachstum durch Training, Physio und Erholung. Ohne Strafen für Ruhetage.</p></div>'+

function calendar(){let first=new Date(new Date().getFullYear(),new Date().getMonth()+calendarOffset,1,12),yy=first.getFullYear(),mm=first.getMonth(),count=new Date(yy,mm+1,0).getDate(),shift=(first.getDay()+6)%7;let cells='';for(let n=0;n<shift;n++)cells+='<span></span>';for(let day=1;day<=count;day++){let d=new Date(yy,mm,day,12),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'),plan=dayPlan(d),hit=sessions().some(s=>s.date===k),valid=k>=BEGIN&&k<=RACE;cells+='<button class="cal-day '+(valid&&plan?'scheduled ':'')+(hit?'done ':'')+(calendarSelected===k?'selected ':'')+(plan==='F'?'football':plan==='P'?'physio':'')+'" data-calday="'+k+'" aria-label="'+k+'"><span>'+day+'</span>'+(valid&&plan?'<i class="cal-dot"></i>':'')+'</button>'}let sel=calendarSelected||date(),d=new Date(sel+'T12:00:00'),plan=dayPlan(d),rec=sessions().filter(s=>s.date===sel),id=plan==='F'?'':plan,sessionPlan=state.plans.find(p=>p.id===id);return '<div class="page-heading"><div><p class="eyebrow">DEINE TRAININGSWOCHE</p><h1>Kalender</h1><div class="muted">Training und Erholung im Überblick</div></div></div><div class="card"><div class="calendar-top"><button class="btn outline" data-caldir="-1" aria-label="Vorheriger Monat">‹</button><h3 style="margin:0">'+first.toLocaleDateString('de-AT',{month:'long',year:'numeric'})+'</h3><button class="btn outline" data-caldir="1" aria-label="Nächster Monat">›</button></div><div class="calendar-grid">'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>'<span class="wk">'+x+'</span>').join('')+cells+'</div><p class="muted" style="margin-top:14px">Grün = geplant · heller Rahmen = ausgewählt · grün umrandet = abgeschlossen</p></div><div class="section-title"><h2>'+esc(prettyDate(sel))+'</h2></div><div class="card">'+(rec.length?rec.map(s=>'<p><span class="tag">Erledigt</span> '+esc(s.name)+'</p>').join(''):'')+(sessionPlan?'<div class="row"><div><span class="tag">'+esc(sessionPlan.kind)+'</span><h3 style="margin:10px 0 4px">'+esc(sessionPlan.name)+'</h3><div class="muted">'+sessionPlan.items.length+' Übungen · '+sessionPlan.mins+' Min.</div></div><button class="play-round small" data-start="'+sessionPlan.id+'">▶</button></div>':plan==='F'?'<p>Fußball ist eingeplant. Bitte nur mit ausreichender Kniebelastbarkeit spielen.</p>':'<p class="muted">Regeneration oder freie Trainingsgestaltung.</p>')+'</div><div class="card"><p class="muted">Deine Wochenstruktur: Kraft, Physio und HYROX. Fußball kann in den Einstellungen für Donnerstag oder Sonntag gewählt werden.</p><button class="btn outline" data-nav="settings">Wochenplan anpassen</button></div>'}
function physioPage(){return '<div class="page-heading"><div><p class="eyebrow">REHAB & PREHAB</p><h1>Physio</h1><div class="muted">Bewegungskontrolle und Knieroutine</div></div></div><div class="workout-hero"><div class="row"><div><span class="tag">1× PRO WOCHE</span><h2>Deine Physio-Einheit</h2><p>45 Minuten · gelenkschonender Einstieg</p></div><button class="play-round" data-start="P">▶</button></div></div><div class="warnbox" style="margin:15px 0">Bei 5/10 Schmerzen zuerst sportphysiotherapeutisch abklären. Hier findest du Übungen, keine medizinische Behandlungsverordnung. Sprungübungen vorerst nicht durchführen.</div><div class="section-title"><h2>Übungsbibliothek</h2><span class="tag">'+physio.length+' Übungen</span></div><div class="plan-tabs">'+['Alle','Basis','Optional','Später'].map(k=>'<button class="'+(kind===k?'active':'')+'" data-kind="'+k+'">'+k+'</button>').join('')+'</div><div class="card">'+physio.filter(x=>kind==='Alle'||x[3]===kind).map(x=>'<div class="exercise-row"><div class="exercise-thumb">'+esc(exSymbol(x[0]))+'</div><div class="exercise-desc"><strong>'+esc(x[0])+'</strong><small>'+esc(x[1])+' · '+esc(x[3])+'</small><small>'+esc(x[2])+'</small></div><button class="btn outline" data-add="P|'+encodeURIComponent(x[0])+'" aria-label="'+esc(x[0])+' hinzufügen">+</button></div>').join('')+'</div>'}
function workout(){let s=state.sessions.find(x=>x.id===selected);if(!s){page='home';return home()}return '<div class="row"><h1 style="margin:0">'+esc(s.name)+'</h1><button class="btn outline" data-nav="training">Zurück</button></div><p class="muted">Training vom '+esc(s.date)+' · Satz für Satz dokumentieren</p><div class="warnbox">Schmerzprovozierende Übung bei 5/10 beenden. Keine automatische Freigabe für Sprungbelastung.</div><div class="card"><div class="two"><div class="form"><label>Dauer (Min.)</label><input type="number" min="1" max="240" data-sess="duration" value="'+s.duration+'"></div><div class="form"><label>RPE (1–10)</label><input type="number" min="1" max="10" data-sess="rpe" value="'+s.rpe+'"></div></div><div class="form"><label>Knieschmerz (0–10)</label><input type="number" min="0" max="10" data-sess="pain" value="'+s.pain+'"></div></div>'+s.items.map((it,i)=>'<div class="card"><div class="row"><div><h3 style="margin:0">'+esc(it.name)+'</h3><div class="muted">'+esc(detail(it.name)[1])+'</div></div><button class="btn critical" data-del-item="'+i+'">×</button></div>'+it.sets.map((set,j)=>'<div class="set"><small>S'+(j+1)+'</small><input aria-label="Wiederholungen oder Zeit" data-set="'+i+':'+j+':reps" value="'+esc(set.reps)+'" placeholder="Wdh./Zeit"><input aria-label="Gewicht" data-set="'+i+':'+j+':kg" value="'+esc(set.kg)+'" placeholder="kg"><input aria-label="Satz erledigt" type="checkbox" data-set="'+i+':'+j+':done" '+(set.done?'checked':'')+'></div>').join('')+'<button class="btn outline" data-new-set="'+i+'">+ Satz</button></div>').join('')+'<div class="card"><div class="form"><label>Notizen</label><textarea data-sess="note">'+esc(s.note)+'</textarea></div><div class="buttons"><button class="btn alt" data-add-session>+ Übung</button><button class="btn" data-finish>Training abschließen</button></div></div>'}

function progress(){let done=sessions(),p=points();let monthly={};done.forEach(s=>{let key=s.date.slice(0,7);monthly[key]=(monthly[key]||0)+1});let vals=Object.entries(monthly).sort((a,b)=>a[0].localeCompare(b[0])).slice(-6),max=Math.max(1,...vals.map(x=>x[1]));return '<div class="page-heading"><div><p class="eyebrow">JEDER SCHRITT ZÄHLT</p><h1>Fortschritt</h1><div class="muted">Training. Entwicklung. Konstanz.</div></div></div><div class="metrics"><div class="card metric"><small>Level</small><b>'+level()+'</b><small>'+p+' XP</small></div><div class="card metric"><small>Workouts</small><b>'+done.length+'</b><small>abgeschlossen</small></div><div class="card metric"><small>Physio</small><b>'+done.filter(x=>x.type==='Physio').length+'</b><small>Einheiten</small></div></div><div class="section-title"><h2>Deine Entwicklung</h2></div><div class="card"><h3>Trainingseinheiten pro Monat</h3>'+(vals.length?'<div class="bar-chart">'+vals.map(x=>'<div class="bar-column"><span class="bar-stick" style="height:'+Math.max(3,Math.round(x[1]/max*115))+'px"></span><span class="bar-label">'+esc(x[0].slice(5))+'</span></div>').join('')+'</div>':'<div class="bar-chart"><div class="muted" style="align-self:center;text-align:center;width:100%">Deine Grafik füllt sich nach dem ersten Workout.</div></div>')+'</div><div class="section-title"><h2>Auszeichnungen</h2></div><div class="card">'+achievement().map(x=>'<div class="unit row"><div><b>'+(x.ok?'✦ ':'◇ ')+esc(x.label)+'</b><div class="muted">'+esc(x.desc)+'</div></div><span class="tag '+(x.ok?'':'warn')+'">'+(x.ok?'Erreicht':'Offen')+'</span></div>').join('')+'</div><div class="section-title"><h2>Trainingshistorie</h2></div><div class="card">'+(done.length?done.slice().reverse().map(s=>'<div class="unit"><b>'+esc(s.date)+' · '+esc(s.name)+'</b><p class="muted">'+s.duration+' Min. · Knie '+s.pain+'/10 · RPE '+s.rpe+' · '+s.items.length+' Übungen</p></div>').join(''):'<p class="muted">Noch keine Trainings abgeschlossen.</p>')+'</div><div c function settings(){return '<h1>Einstellungen</h1><div class="card"><h3>Deine Wochenstruktur</h3><p class="muted">1 × Physio, 2 × Kraft/HYROX sowie Fußball nur nach Abklärung.</p><div class="form"><label>Fußball</label><select id="football">'+['pausiert','Donnerstag','Sonntag'].map(x=>'<option '+(x===state.football?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="form"><label>Partnerin / Partner (freiwillig)</label><input id="partner" value="'+esc(state.partner)+'" placeholder="Optionaler Name"></div><button class="btn" data-save-settings>Einstellungen speichern</button></div><div class="card"><h3>Datensicherung</h3><p class="muted">Trainingsdaten liegen ausschließlich lokal in diesem Browser. Kein automatischer Sync. Beim Browserwechsel oder Datenlöschen können Einträge verloren gehen. Regelmäßig ein Backup herunterladen.</p><div class="buttons"><button class="btn alt" data-export>JSON-Backup</button><button class="btn alt" data-csv>CSV-Export</button></div><div class="form"><label>JSON-Backup importieren</label><input id="import" type="file" accept=".json,application/json"></div><button class="btn critical" data-clear>Daten löschen</button></div><div class="card"><h3>Gamification nach Octalysis</h3><p class="muted">Progress & Entwicklung: Level, Meilensteine und Wochenphasen. Ownership: eigene Pläne. Empowerment: selbst auswählbare Übungen. Zweck: gemeinsam HYROX finishen. Keine Verlust-Serien oder Schuldgefühle an Ruhetagen.</p><p class="muted">Unabhängiger Trainingsplaner · keine offizielle HYROX-App · keine Diagnose, keine automatische Therapieempfehlung.</p></div>'}

});
document.addEventListener('input',e=>{let d=e.target.dataset;if(d.plan){let p=state.plans.find(x=>x.id===selected);p[d.plan]=d.plan==='mins'?Number(e.target.value):e.target.value;save()}else if(d.sess){let s=state.sessions.find(x=>x.id===selected);s[d.sess]=['duration','rpe','pain'].includes(d.sess)?Number(e.target.value):e.target.value;save()}else if(d.set){let [i,j,k]=d.set.split(':'),s=state.sessions.find(x=>x.id===selected);s.items[+i].sets[+j][k]=k==='done'?e.target.checked:e.target.value;save()}else if(e.target.id==='search'){search=e.target.value;let pos=e.target.selectionStart;render();let input=$('#search');input.focus();input.setSelectionRange(pos,pos)}});
