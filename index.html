<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10382f"><meta name="description" content="HYROX Mixed Doubles Trainer mit Physio und lokalem Tracking"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>HYROX Trainer · Mixed Doubles & Physio</title><style>
:root{font:15px/1.48 system-ui,-apple-system,Segoe UI,sans-serif;color:#15352e;background:#f4f7f3}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #1bac8a;outline-offset:2px}h1,h2,h3,p{margin-top:0}h1{font-size:33px;letter-spacing:-1px;line-height:1.12}h2{font-size:21px;letter-spacing:-.5px}h3{font-size:16px}p{line-height:1.55}main{max-width:860px;margin:auto;padding:20px 16px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.logo{font-size:28px;font-weight:900;letter-spacing:-2px}.logo span{color:#13a788}.meta,.muted{color:#73867d;font-size:12px}.hero{background:#10392f;color:white;border-radius:24px;padding:27px;position:relative;overflow:hidden}.hero:after{content:"FORM";font-size:94px;letter-spacing:-10px;font-weight:900;position:absolute;right:-45px;bottom:-27px;opacity:.055;pointer-events:none}.hero small{color:#9fe1c9;text-transform:uppercase;letter-spacing:2px}.hero p{color:#d6ebe0;margin-bottom:20px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chips span{background:#2a5849;border-radius:99px;padding:7px 11px;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.card{background:white;border:1px solid #e0eae2;border-radius:19px;padding:18px;margin:12px 0;box-shadow:0 6px 24px #14382606}.metric b{display:block;font-size:27px}.metric small{font-size:11px;color:#6a7a70}.section{margin-top:25px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:9px}.tag{font-size:11px;font-weight:750;background:#e8f6ee;color:#27715e;padding:6px 10px;border-radius:40px;display:inline-block}.tag.warn{background:#fff0d5;color:#966124}.btn{border:0;border-radius:12px;padding:11px 15px;min-height:43px;background:#136c58;color:#fff;font-weight:750}.btn.alt{background:#eaf5ee;color:#235747}.btn.outline{background:white;color:#246152;border:1px solid #c7ddd2}.btn.critical{background:#feeceb;color:#9c3b36}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;background:#fff;border-top:1px solid #d9e6df;padding:8px 8px calc(10px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;color:#688077;display:grid;gap:3px;justify-items:center;min-width:64px;max-width:120px;flex:1;border-radius:12px;padding:6px 3px;font-size:10px;font-weight:700}.nav button b{font-size:21px}.nav button.active{background:#e5f6ec;color:#13705a}.form{display:grid;gap:6px;margin:13px 0}.form label{font-size:12px;font-weight:750;color:#516c5c}input,textarea,select{border:1px solid #d6e3db;border-radius:10px;padding:10px;background:#fff;color:#15362e;max-width:100%;width:100%}textarea{min-height:70px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.unit{padding:13px 0;border-bottom:1px solid #e7eee8}.unit:last-child{border-bottom:0}.set{display:grid;grid-template-columns:32px 1fr 1fr 32px;gap:8px;align-items:center;margin:9px 0}.set input{min-width:0}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.small{font-size:12px}.warnbox{background:#fff4df;color:#7b5020;border:1px solid #f4dfb3;border-radius:13px;padding:14px;font-size:13px;line-height:1.5}.goodbox{background:#e9f7ed;color:#245b41;border-radius:13px;padding:14px;font-size:13px}.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.week{border:1px solid #dae7dd;background:white;border-radius:12px;padding:12px 5px;min-height:70px;text-align:center}.week.active{background:#155c4a;color:white}.week b{display:block;font-size:17px}.progress{height:10px;background:#e1eee5;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#19a985}.barrow{display:grid;grid-template-columns:80px 1fr 34px;align-items:center;gap:8px;margin:10px 0}.libitem{padding:15px 0;border-bottom:1px solid #e7ece8}.libitem:last-child{border:0}.pill{border:1px solid #d9e8de;background:#fff;border-radius:99px;padding:8px 12px;color:#315f4c}.pill.active{background:#16654f;color:white}.level{font-size:12px;color:#759084}.divider{border-top:1px solid #e5ece6;margin:17px 0}a{color:#13745e}code{word-break:break-word}@media(max-width:400px){main{padding:12px 12px 104px}.card{padding:14px}.metrics{gap:6px}.metric b{font-size:23px}.nav button{font-size:9px}.weeks{gap:5px}}@media(min-width:700px){.nav{max-width:860px;left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0}.hero{padding:34px}} 
</style></head><body><main id="app"></main><script>
'use strict';
const DB='form-hyrox-trainer-v1',RACE='2027-02-19',BEGIN='2026-10-28';
const physio=[
['Spanish Squat','3 × 20 Sek.','Nur bei guter Verträglichkeit, am besten nach Anleitung durch Physio.','Basis'],
['Lunge Hold mit Zehen auf Erhöhung','2 × 15 Sek./Seite','Einbeinige Beuge: zunächst zurückstellen.','Später'],
['Lunge + Jump','2 × 5/Seite','Sprünge nur nach Freigabe und Belastungsaufbau.','Später'],
['Copenhagen Plank','2 × 15 Sek./Seite','Kurzer Hebel, ruhig halten.','Basis'],
['Poliquin Step Down','2 × 8/Seite','Erst nach Abklärung schmerzarm einbauen.','Später'],
['Sissy Squat','2 × 8','Hohe vordere Kniebelastung: derzeit nicht trainieren.','Später'],
['Alternating Toe Taps Standing (Barbell)','2 × 10','Langsam, mit leichtem Gewicht, sicherer Stand.','Optional'],
['Box Step Down (Tempo)','2 × 8/Seite','Nur mit niedriger Stufe und sauberer Kontrolle.','Später'],
['Tibialis Rotation','2 × 10/Seite','Fuß- und Unterschenkelbewegung kontrolliert, nicht ins Knie verdrehen.','Basis'],
['SL Hamstring Bridge isometrisch','2 × 15 Sek./Seite','Hüfte hoch, Knieposition komfortabel.','Basis'],
['Single Leg Box Jumps','2 × 4/Seite','Einbeinig abspringen, beidbeinig landen, erst nach Return-to-Jump-Freigabe.','Später'],
['Seated Leg Raise','2 × 10/Seite','Sitzend gestrecktes Bein schmerzarm anheben.','Basis'],
['Seated Hip Internal Rotation','2 × 10/Seite','Rolle zwischen Knien; sanfte kontrollierte Rotation.','Basis'],
['Band Resisted Crossover Step','2 × 8/Seite','Widerstandsband leicht, Knie stabil.','Optional'],
['Banded Lunge Heel Tap','2 × 8/Seite','Band zieht nach innen, Rückwärts-Lunge, Ferse tippt vorne: erst später.','Später']
];
const exercises=[
['Radfahren locker','8–30 Min.','Ausdauer'],['SkiErg','400 m','HYROX'],['RowErg','400 m','HYROX'],['Farmers Carry','2 × 30 m','HYROX'],['Sled Push','10–15 m','HYROX'],['Sled Pull','10–15 m','HYROX'],['Wall Balls','20 Wiederholungen','HYROX'],['Burpee Broad Jumps','10 m','HYROX'],['Sandbag Lunges','20 m','HYROX'],['Bankdrücken','3 × 6','Kraft'],['Rumänisches Kreuzheben','3 × 8','Kraft'],['Kabelrudern','3 × 10','Kraft'],['Glute Bridge','2 × 12','Kraft'],['Wadenheben','2 × 15','Kraft'],['Lockeres Laufen/Gehen','Intervall','Ausdauer'],...physio.map(x=>[x[0],x[1],'Physio',x[2],x[3]])
];
const initialPlans=()=>[
{id:'P',name:'Physio & Knie',kind:'Physio',mins:45,items:['Radfahren locker','Spanish Squat','Copenhagen Plank','SL Hamstring Bridge isometrisch','Seated Leg Raise','Seated Hip Internal Rotation','Tibialis Rotation']},
{id:'A',name:'Kraft & Ausdauer',kind:'Kraft',mins:55,items:['Radfahren locker','Rumänisches Kreuzheben','Bankdrücken','Kabelrudern','Glute Bridge']},
{id:'C',name:'HYROX Mixed Doubles',kind:'HYROX',mins:55,items:['SkiErg','RowErg','Farmers Carry','Kabelrudern','Radfahren locker']}
];
const fresh=()=>({v:1,plans:initialPlans(),sessions:[],checkins:[],custom:[],football:'pausiert',activeWeek:1,partner:'',notes:'',levelSettings:{},cleared:false});
let state=fresh(),page='home',selected=null,kind='Alle',search='',saveError=false;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const daysUntil=()=>Math.max(0,Math.round((new Date(RACE+'T12:00:00')-new Date(date()+'T12:00:00'))/86400000));
const weeks=()=>Math.max(1,Math.min(16,1+Math.floor((new Date(date()+'T12:00:00')-new Date(BEGIN+'T12:00:00'))/604800000)));
const stage=w=>w<=4?'Knie & Grundlage':w<=8?'Ausdaueraufbau':w<=12?'Mixed Doubles':w<=14?'Rennvorbereitung':'Tapering';
const approved=name=>!['Lunge + Jump','Sissy Squat','Single Leg Box Jumps','Banded Lunge Heel Tap','Poliquin Step Down','Box Step Down (Tempo)','Lunge Hold mit Zehen auf Erhöhung','Burpee Broad Jumps','Sandbag Lunges','Wall Balls','Sled Push'].includes(name);
const catalog=()=>[...exercises,...state.custom.map(x=>[x,'Individuell','Eigene Übung'])];
const detail=name=>catalog().find(x=>x[0]===name)||[name,'3 × 8','Individuell'];
function read(){try{let raw=localStorage.getItem(DB);if(raw){let d=JSON.parse(raw);if(d&&Array.isArray(d.plans)&&Array.isArray(d.sessions)&&Array.isArray(d.checkins)){state={...fresh(),...d}}}}catch(e){saveError=true}}
function save(){try{localStorage.setItem(DB,JSON.stringify(state));saveError=false}catch(e){saveError=true}renderStatus()}
function renderStatus(){let e=$('#save-status');if(e)e.textContent=saveError?'Speicherfehler · Bitte JSON sichern':'Lokal gespeichert'}
function sessions(){return state.sessions.filter(x=>x.status==='done')}
function points(){let x=sessions().reduce((a,s)=>a+(s.type==='Physio'?45:75),0);return x}
function level(){return Math.floor(points()/300)+1}
function achievement(){let s=sessions(),p=s.filter(x=>x.type==='Physio').length,h=s.filter(x=>x.type==='HYROX').length;return [{label:'Erster Schritt',ok:s.length>=1,desc:'Ein erstes Workout abschließen'},{label:'Knie-Routine',ok:p>=4,desc:'Vier Physio-Einheiten'},{label:'HYROX Starter',ok:h>=3,desc:'Drei Doubles-Einheiten'},{label:'Dranbleiber',ok:s.length>=12,desc:'Zwölf absolvierte Workouts'}]}
function nav(){return '<nav class="nav">'+[['home','⌂','Heute'],['training','◈','Training'],['physio','✚','Physio'],['progress','↗','Fortschritt'],['settings','⚙','Mehr']].map(x=>'<button class="'+(page===x[0]?'active':'')+'" data-nav="'+x[0]+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join('')+'</nav>'}
function renderAppHeader(){return '<header class="top"><div class="logo">HYROX<span>.</span></div><div class="meta">HYROX WIEN · 19. FEB 2027<br><span id="save-status"></span></div></header>'}
function home(){let w=weeks(),s=sessions(),p=points();return '<div class="hero"><small>DEIN WEG ZUM RACE</small><h1>Train smart.<br>Finish strong.</h1><p>Mixed Doubles · 1 Physio, 2 Trainingseinheiten · Fußball nur nach Knie-Freigabe.</p><div class="chips"><span>Woche '+w+'/16</span><span>'+stage(w)+'</span><span>Finish-Ziel ~1:30 h</span></div></div><div class="metrics"><div class="card metric"><small>Workouts</small><b>'+s.length+'</b><small>absolviert</small></div><div class="card metric"><small>Dein Level</small><b>'+level()+'</b><small>'+p+' XP</small></div><div class="card metric"><small>Bis zum Race</small><b>'+daysUntil()+'</b><small>Tage</small></div></div><div class="card"><div class="row"><h3>Level-Fortschritt</h3><span class="tag">'+(p%300)+'/300 XP</span></div><div class="progress"><div style="width:'+(p%300/3)+'%"></div></div><p class="muted" style="margin:9px 0 0">XP belohnen dokumentiertes Training und Physio. Ruhetage haben keine Strafe.</p></div><section class="section"><h2>Deine drei Einheiten</h2>'+state.plans.map(x=>'<div class="card"><div class="row"><div><span class="tag">'+esc(x.kind)+' · '+x.mins+' Min.</span><h3 style="margin:9px 0 4px">'+esc(x.name)+'</h3><div class="muted">'+x.items.length+' Übungen</div></div><button class="btn" data-start="'+x.id+'">Starten</button></div></div>').join('')+'</section><section class="section"><h2>Tagesform & Knie</h2><div class="card"><div class="warnbox">5/10 Knieschmerz bei Fußball und einbeiniger Beugung: Knie sportphysiotherapeutisch abklären. Vorläufig keine Sprünge und tiefen einbeinigen Belastungen.</div><div class="two"><div class="form"><label>Knieschmerz (0–10)</label><input id="pain" type="number" min="0" max="10" value="'+(state.checkins.at(-1)?.pain??5)+'"></div><div class="form"><label>Energie (1–5)</label><input id="energy" type="number" min="1" max="5" value="3"></div></div><button class="btn alt" data-checkin>Check-in speichern</button></div></section>'}
function training(){return '<h1>Dein Trainingsplan</h1><p class="muted">Drei editierbare Vorlagen. Abgeschlossene Workouts bleiben als Momentaufnahme gespeichert.</p><div class="warnbox">Laufprogression erst nach Knieabklärung und guter Belastungsreaktion; Fußball vorerst pausiert.</div>'+state.plans.map(x=>'<div class="card"><div class="row"><div><span class="tag">'+x.kind+'</span><h2 style="margin:10px 0 4px">'+esc(x.name)+'</h2><div class="muted">'+x.mins+' Min. · '+x.items.length+' Übungen</div></div></div><div class="small">'+x.items.map(n=>'<div class="unit">'+esc(n)+'</div>').join('')+'</div><div class="buttons"><button class="btn" data-start="'+x.id+'">Workout starten</button><button class="btn alt" data-edit="'+x.id+'">Bearbeiten</button></div></div>').join('')+'<div class="card"><h3>16-Wochen-Periodisierung</h3><div class="weeks">'+Array.from({length:16},(_,i)=>'<button class="week '+(weeks()===i+1?'active':'')+'" data-week="'+(i+1)+'"><b>'+(i+1)+'</b><small>'+stage(i+1).split(' ')[0]+'</small></button>').join('')+'</div><p class="small muted">Woche 1–4 Grundlagentraining und Knie · 5–8 Laufaufbau nach Freigabe · 9–12 Kombinationen · 13–14 Simulation · 15–16 Tapering.</p></div>'}
function physioPage(){return '<h1>Physio & Knie</h1><div class="warnbox">Deine vorderen Knieschmerzen erreichen 5/10. Die Übungen sind ein Katalog, keine verordnete Therapie. Sprünge und anspruchsvolle einbeinige Beugen sind als „Später“ markiert. Belastung mit deinem Physiotherapeuten abstimmen.</div><div class="card"><div class="row"><div><h3>Deine Physio-Einheit</h3><div class="muted">45 Minuten · kontrollierter Einstieg</div></div><button class="btn" data-start="P">Starten</button></div></div><div class="buttons">'+['Alle','Basis','Optional','Später'].map(k=>'<button class="pill '+(kind===k?'active':'')+'" data-kind="'+k+'">'+k+'</button>').join('')+'</div><div class="card">'+physio.filter(x=>kind==='Alle'||x[3]===kind).map(x=>'<div class="libitem"><div class="row"><strong>'+esc(x[0])+'</strong><span class="tag '+(x[3]==='Später'?'warn':'')+'">'+x[3]+'</span></div><div class="small">'+esc(x[1])+'</div><div class="muted">'+esc(x[2])+'</div><button class="btn outline" style="margin-top:9px" data-add="P|'+encodeURIComponent(x[0])+'">+ Zur Physio-Vorlage</button></div>').join('')+'</div>'}
function workout(){let s=state.sessions.find(x=>x.id===selected);if(!s){page='home';return home()}return '<div class="row"><h1 style="margin:0">'+esc(s.name)+'</h1><button class="btn outline" data-nav="training">Zurück</button></div><p class="muted">Training vom '+esc(s.date)+' · Satz für Satz dokumentieren</p><div class="warnbox">Schmerzprovozierende Übung bei 5/10 beenden. Keine automatische Freigabe für Sprungbelastung.</div><div class="card"><div class="two"><div class="form"><label>Dauer (Min.)</label><input type="number" min="1" max="240" data-sess="duration" value="'+s.duration+'"></div><div class="form"><label>RPE (1–10)</label><input type="number" min="1" max="10" data-sess="rpe" value="'+s.rpe+'"></div></div><div class="form"><label>Knieschmerz (0–10)</label><input type="number" min="0" max="10" data-sess="pain" value="'+s.pain+'"></div></div>'+s.items.map((it,i)=>'<div class="card"><div class="row"><div><h3 style="margin:0">'+esc(it.name)+'</h3><div class="muted">'+esc(detail(it.name)[1])+'</div></div><button class="btn critical" data-del-item="'+i+'">×</button></div>'+it.sets.map((set,j)=>'<div class="set"><small>S'+(j+1)+'</small><input aria-label="Wiederholungen oder Zeit" data-set="'+i+':'+j+':reps" value="'+esc(set.reps)+'" placeholder="Wdh./Zeit"><input aria-label="Gewicht" data-set="'+i+':'+j+':kg" value="'+esc(set.kg)+'" placeholder="kg"><input aria-label="Satz erledigt" type="checkbox" data-set="'+i+':'+j+':done" '+(set.done?'checked':'')+'></div>').join('')+'<button class="btn outline" data-new-set="'+i+'">+ Satz</button></div>').join('')+'<div class="card"><div class="form"><label>Notizen</label><textarea data-sess="note">'+esc(s.note)+'</textarea></div><div class="buttons"><button class="btn alt" data-add-session>+ Übung</button><button class="btn" data-finish>Training abschließen</button></div></div>'}
function editor(){let p=state.plans.find(x=>x.id===selected);if(!p){page='training';return training()}return '<div class="row"><h1 style="margin:0">Vorlage bearbeiten</h1><button class="btn alt" data-nav="training">Fertig</button></div><p class="muted">Änderungen gelten nur für zukünftige Trainingsstarts.</p><div class="card"><div class="form"><label>Name</label><input data-plan="name" value="'+esc(p.name)+'"></div><div class="form"><label>Dauer Minuten</label><input type="number" min="5" max="240" data-plan="mins" value="'+p.mins+'"></div>'+p.items.map((n,i)=>'<div class="unit row"><span>'+esc(n)+'</span><div class="buttons" style="margin:0"><button class="btn outline" data-shift="'+i+':-1">↑</button><button class="btn outline" data-shift="'+i+':1">↓</button><button class="btn critical" data-del-plan="'+i+'">×</button></div></div>').join('')+'<div class="buttons"><button class="btn" data-show-add>+ Übung hinzufügen</button><button class="btn alt" data-nav="training">Speichern & zurück</button></div></div>'}
function library(){let list=catalog().filter(x=>(kind==='Alle'||x[2]===kind||x[3]===kind)&&x[0].toLowerCase().includes(search.toLowerCase()));return '<div class="row"><h1 style="margin:0">Übung hinzufügen</h1><button class="btn alt" data-back>Zurück</button></div><div class="form"><label>Übung suchen</label><input id="search" placeholder="z. B. Copenhagen, SkiErg" value="'+esc(search)+'"></div><div class="buttons">'+['Alle','Physio','HYROX','Kraft','Ausdauer'].map(x=>'<button class="pill '+(x===kind?'active':'')+'" data-kind="'+x+'">'+x+'</button>').join('')+'</div><div class="card">'+list.map(x=>'<div class="libitem"><div class="row"><div><strong>'+esc(x[0])+'</strong><div class="muted">'+esc(x[1])+' · '+esc(x[2])+'</div></div><button class="btn alt" data-pick="'+encodeURIComponent(x[0])+'">Hinzufügen</button></div>'+(x[3]?'<p class="muted">'+esc(x[3])+'</p>':'')+'</div>').join('')+'</div><div class="card"><h3>Eigene Übung</h3><div class="form"><input id="newEx" placeholder="Name der neuen Übung"></div><button class="btn alt" data-new-ex>Erstellen</button></div>'}
function progress(){let done=sessions(),p=points();return '<h1>Dein Fortschritt</h1><div class="metrics"><div class="card metric"><small>Level</small><b>'+level()+'</b><small>'+p+' XP</small></div><div class="card metric"><small>Workouts</small><b>'+done.length+'</b><small>gesamt</small></div><div class="card metric"><small>Physio</small><b>'+done.filter(x=>x.type==='Physio').length+'</b><small>Einheiten</small></div></div><h2>Meilensteine</h2><div class="card">'+achievement().map(x=>'<div class="unit row"><div><b>'+(x.ok?'✓ ':'○ ')+x.label+'</b><div class="muted">'+x.desc+'</div></div><span class="tag '+(x.ok?'':'warn')+'">'+(x.ok?'Erreicht':'Offen')+'</span></div>').join('')+'</div><h2>Trainingshistorie</h2><div class="card">'+(done.length?done.slice().reverse().map(s=>'<div class="unit"><b>'+esc(s.date)+' · '+esc(s.name)+'</b><p class="muted">'+s.duration+' Min. · Knie '+s.pain+'/10 · RPE '+s.rpe+' · '+s.items.length+' Übungen</p></div>').join(''):'<p class="muted">Noch keine Einheiten abgeschlossen.</p>')+'</div><h2>Knieschmerz-Verlauf</h2><div class="card">'+(state.checkins.length?state.checkins.slice(-8).map(c=>'<div class="barrow"><small>'+c.date.slice(5)+'</small><div class="progress"><div style="width:'+(c.pain*10)+'%"></div></div><b>'+c.pain+'/10</b></div>').join(''):'<p class="muted">Noch kein Knie-Check gespeichert.</p>')+'</div>'}
function settings(){return '<h1>Einstellungen</h1><div class="card"><h3>Deine Wochenstruktur</h3><p class="muted">1 × Physio, 2 × Kraft/HYROX sowie Fußball nur nach Abklärung.</p><div class="form"><label>Fußball</label><select id="football">'+['pausiert','Donnerstag','Sonntag'].map(x=>'<option '+(x===state.football?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="form"><label>Partnerin / Partner (freiwillig)</label><input id="partner" value="'+esc(state.partner)+'" placeholder="Optionaler Name"></div><button class="btn" data-save-settings>Einstellungen speichern</button></div><div class="card"><h3>Datensicherung</h3><p class="muted">Trainingsdaten liegen ausschließlich lokal in diesem Browser. Kein automatischer Sync. Beim Browserwechsel oder Datenlöschen können Einträge verloren gehen. Regelmäßig ein Backup herunterladen.</p><div class="buttons"><button class="btn alt" data-export>JSON-Backup</button><button class="btn alt" data-csv>CSV-Export</button></div><div class="form"><label>JSON-Backup importieren</label><input id="import" type="file" accept=".json,application/json"></div><button class="btn critical" data-clear>Daten löschen</button></div><div class="card"><h3>Gamification nach Octalysis</h3><p class="muted">Progress & Entwicklung: Level, Meilensteine und Wochenphasen. Ownership: eigene Pläne. Empowerment: selbst auswählbare Übungen. Zweck: gemeinsam HYROX finishen. Keine Verlust-Serien oder Schuldgefühle an Ruhetagen.</p><p class="muted">Unabhängiger Trainingsplaner · keine offizielle HYROX-App · keine Diagnose, keine automatische Therapieempfehlung.</p></div>'}
let addContext='plan';
function render(){let fn={home,training,physio:physioPage,workout,editor,library,progress,settings}[page]||home;$('#app').innerHTML=renderAppHeader()+fn()+nav();renderStatus()}
function download(filename,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
const uuid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
function start(id){let p=state.plans.find(x=>x.id===id);if(!p)return;let s={id:uuid(),plan:id,name:p.name,type:p.kind,date:date(),duration:p.mins,rpe:5,pain:state.checkins.at(-1)?.pain??5,note:'',status:'draft',items:p.items.map(name=>({name,sets:[{reps:detail(name)[1],kg:'',done:false}]}))};state.sessions.push(s);selected=s.id;save();page='workout';render()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.nav){page=d.nav;selected=null;kind='Alle';render()}
else if(d.start)start(d.start);
else if(d.checkin!==undefined){let p=Number($('#pain').value),en=Number($('#energy').value);if(!Number.isFinite(p)||p<0||p>10||en<1||en>5)return alert('Werte prüfen');state.checkins.push({date:date(),pain:p,energy:en});save();render()}
else if(d.kind){kind=d.kind;render()}
else if(d.edit){selected=d.edit;page='editor';render()}
else if(d.week){alert('Woche '+d.week+': '+stage(Number(d.week))+' · Die Belastung wird entsprechend Knieverträglichkeit angepasst.')}
else if(d.delPlan!==undefined){let p=state.plans.find(x=>x.id===selected);p.items.splice(Number(d.delPlan),1);save();render()}
else if(d.shift){let p=state.plans.find(x=>x.id===selected),[i,step]=d.shift.split(':').map(Number),j=i+step;if(j>=0&&j<p.items.length){[p.items[i],p.items[j]]=[p.items[j],p.items[i]];save();render()}}
else if(d.showAdd!==undefined){addContext='plan';page='library';kind='Alle';render()}
else if(d.addSession!==undefined){addContext='session';page='library';kind='Alle';render()}
else if(d.back!==undefined){page=addContext==='session'?'workout':'editor';render()}
else if(d.pick){let name=decodeURIComponent(d.pick);if(addContext==='session'){let s=state.sessions.find(x=>x.id===selected);s.items.push({name,sets:[{reps:detail(name)[1],kg:'',done:false}]});page='workout'}else{state.plans.find(x=>x.id===selected).items.push(name);page='editor'}save();render()}
else if(d.newEx!==undefined){let n=$('#newEx').value.trim().slice(0,100);if(n&&!catalog().some(x=>x[0]===n)){state.custom.push(n);save();render()}}
else if(d.add){let [id,n]=d.add.split('|');let p=state.plans.find(x=>x.id===id);p.items.push(decodeURIComponent(n));save();alert('Zur Vorlage hinzugefügt')}
else if(d.newSet!==undefined){let s=state.sessions.find(x=>x.id===selected);s.items[+d.newSet].sets.push({reps:'',kg:'',done:false});save();render()}
else if(d.delItem!==undefined){let s=state.sessions.find(x=>x.id===selected);s.items.splice(+d.delItem,1);save();render()}
else if(d.finish!==undefined){let s=state.sessions.find(x=>x.id===selected);s.status='done';save();page='progress';render()}
else if(d.saveSettings!==undefined){state.football=$('#football').value;state.partner=$('#partner').value.slice(0,100);save();render()}
else if(d.export!==undefined)download('HYROX-Trainer-backup-'+date()+'.json',JSON.stringify(state,null,2),'application/json');
else if(d.csv!==undefined){let rows=[['Datum','Training','Typ','Dauer','RPE','Knie','Uebung','Satz','Wiederholungen/Zeit','Gewicht','Erledigt']];sessions().forEach(s=>s.items.forEach(x=>x.sets.forEach((v,i)=>rows.push([s.date,s.name,s.type,s.duration,s.rpe,s.pain,x.name,i+1,v.reps,v.kg,v.done?'Ja':'Nein']))));download('HYROX-Trainer.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
else if(d.clear!==undefined&&confirm('Wirklich sämtliche lokalen Daten löschen? Zuerst Backup erstellen!')){state=fresh();save();render()}
});
document.addEventListener('input',e=>{let d=e.target.dataset;if(d.plan){let p=state.plans.find(x=>x.id===selected);p[d.plan]=d.plan==='mins'?Number(e.target.value):e.target.value;save()}else if(d.sess){let s=state.sessions.find(x=>x.id===selected);s[d.sess]=['duration','rpe','pain'].includes(d.sess)?Number(e.target.value):e.target.value;save()}else if(d.set){let [i,j,k]=d.set.split(':'),s=state.sessions.find(x=>x.id===selected);s.items[+i].sets[+j][k]=k==='done'?e.target.checked:e.target.value;save()}else if(e.target.id==='search'){search=e.target.value;let pos=e.target.selectionStart;render();let input=$('#search');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{if(e.target.id!=='import')return;try{const f=e.target.files?.[0];if(!f)return;const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.plans)||!Array.isArray(d.sessions)||!Array.isArray(d.checkins))throw Error('Ungültiges Backup');if(!confirm('Vorhandene Daten durch dieses Backup ersetzen?'))return;state={...fresh(),...d};save();render();alert('Backup importiert')}catch(err){alert('Import fehlgeschlagen: '+err.message)}});
read();render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
